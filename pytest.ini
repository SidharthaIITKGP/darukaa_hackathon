[pytest]
testpaths = tests
markers =
    slow: takes tens of seconds or more. A cross-encoder forward pass per
        candidate, a subprocess demo run, or the whole eval harness. Excluded
        with -m "not slow" for a fast loop; the full suite still runs them and
        CI must not skip them, because the slow tests are the ones that check
        the parts of the system with the most moving pieces.
